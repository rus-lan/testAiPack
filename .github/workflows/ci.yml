name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache contract deps
        uses: actions/cache@v4
        with:
          path: contract/node_modules
          key: contract-${{ runner.os }}-${{ hashFiles('contract/package-lock.json') }}

      - name: Install contract deps
        working-directory: contract
        run: npm ci

      - name: Install root deps
        run: npm ci

      - name: Compile TypeSpec contracts
        run: npm run contract:compile

      - name: Codegen TS types from contracts
        run: npm run contract:codegen

      - name: Verify codegen is deterministic
        run: |
          if [ -n "$(git status --porcelain src/generated)" ]; then
            echo "::error::Codegen produced output that differs from the committed files."
            echo "Run 'npm run contract:codegen' locally and commit the result."
            git status --porcelain src/generated
            git --no-pager diff src/generated | head -80
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Smoke-test binary
        run: ./dist/testaipack --help

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: testaipack-linux-x64
          path: dist/testaipack
          retention-days: 7

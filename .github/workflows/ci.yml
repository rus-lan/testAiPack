name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install contract deps
        working-directory: contract
        run: npm ci

      - name: Install root deps
        run: npm ci

      - name: Compile TypeSpec contracts
        run: npm run contract:compile

      - name: Codegen TS types from contracts
        run: npm run contract:codegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: testaipack-binary
          path: dist/testaipack
